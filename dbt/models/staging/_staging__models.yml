version: 2

models:
  - name: stg_player_counts
    description: >
      Player-count snapshots on a strict hourly grain. Truncates logical_hour
      so manual-run timestamps collapse onto the hour; otherwise a passthrough.
  - name: stg_tracked_universe
    description: >
      The universe registry with columns renamed for downstream reads: name
      becomes app_name (matching the app_metadata extraction it will coalesce
      with in dim_game) and source becomes tracked_source. No rows filtered,
      no values changed.
  - name: stg_app_metadata
    description: >
      Typed columns extracted from the appdetails jsonb: name, release date,
      genres. The raw jsonb stays available upstream.
