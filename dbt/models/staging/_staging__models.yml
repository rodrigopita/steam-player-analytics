version: 2

models:
  - name: stg_player_counts
    description: >
      Player-count snapshots on a strict hourly grain. Truncates logical_hour
      so manual-run timestamps collapse onto the hour; otherwise a passthrough.
  - name: stg_tracked_universe
    description: >
      The universe registry with columns renamed for downstream reads: name
      becomes app_name (matching the app_metadata extraction it will coalesce
      with in dim_game) and source becomes tracked_source. No rows filtered,
      no values changed.
  - name: stg_app_metadata
    description: >
      Typed columns extracted from the appdetails jsonb: the raw blob stays in
      raw.app_metadata, and a new field is a one-line extraction added here,
      never a jsonb read downstream. Absent values stay null, except
      achievement_count, where an absent block means non, so 0. release_date
      parses only the observed 'Mon DD, YYYY' shape and nulls anything else.
      genre_names flattens the genres array to text[] in Steam's order;
      per-genre marts unnest it, and a bridge table stays unbuilt until
      something needs one. steam_appid and price_currency exist for
      validation, not analytics: marts read neither.
