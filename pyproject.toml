[project]
name = "steam-player-analytics"
version = "0.1.0"
description = "Steam player analytics — Airflow + dbt portfolio project"
requires-python = "==3.14.*"
# Runtime dependencies must be mirrored in requirements.txt, which is what the
# Astro Runtime image actually installs; this venv exists for IDE/tests only.
dependencies = [
    "apache-airflow-providers-amazon==9.35.0",
    "apache-airflow-providers-postgres==7.0.2",
]

[dependency-groups]
dashboard = [
    "ipykernel>=7.3.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "pandas>=3.0.5",
    "plotly>=7.0.0",
    "psycopg[binary]>=3.3.4",
    "sqlalchemy>=2.0.52",
]
dev = [
    # Already baked into the Astro Runtime image — never add to requirements.txt.
    "apache-airflow==3.3.1",
    "dbt-core>=1.12.3",
    "dbt-postgres>=1.11.0",
    "pytest>=8",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
